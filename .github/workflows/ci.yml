name: Validate plugin

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli
      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './dist/*' -print0 | xargs -0 -r -n 1 php -l
      - name: Check editor JavaScript and block metadata
        run: |
          find blocks -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          python3 -c 'import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path("blocks").rglob("block.json") ]'
      - name: Build and verify allowlisted ZIP
        run: |
          python3 tools/release.py build
          python3 tools/release.py verify
          cd dist && sha256sum -c ./*.zip.sha256
      - name: Fresh WordPress integration of exact ZIP
        run: bash tests/run-wordpress-integration.sh dist/*.zip
